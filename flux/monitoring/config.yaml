---
# The Grafana admin ExternalSecret (generated in-cluster by an ESO Password
# generator); the grafana stack dependsOn it so the admin secret is synced before
# the Grafana instance starts. The `monitoring` namespace is owned by the base
# prometheus stack now, so this stack only mints the secret into it. The
# `monitoring` reconcile root dependsOn eso-config, so ESO is running before this
# ExternalSecret syncs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/monitoring/config
  prune: true
  wait: true
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
