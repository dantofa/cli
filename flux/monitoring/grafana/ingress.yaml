---
# Grafana ingress. Like echo: no ingressClassName, so it uses the cluster's default
# IngressClass (cloudflare-tunnel by default; traefik on a --dolb DOKS cluster).
# Served under a /grafana path on the cluster base_domain (serve_from_sub_path is
# set on the Grafana instance) rather than a grafana.<base_domain> subdomain, which
# would sit two levels under the zone apex, outside Cloudflare Universal SSL. Routes
# to the operator-created Grafana Service (grafana-service:3000). ${base_domain} is
# substituted from cluster-vars by the grafana Kustomization.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  rules:
    - host: ${base_domain}
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
