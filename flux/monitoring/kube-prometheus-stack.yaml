---
# The kube-prometheus-stack stack. dependsOn monitoring-config (namespace + Grafana
# admin secret). Its own postBuild.substituteFrom cluster-vars fills ${storage_class}
# and ${base_domain} in release.yaml (the monitoring root fills ${source_kind}/
# ${source_name} in this file's sourceRef).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/monitoring/kube-prometheus-stack
  prune: true
  dependsOn:
    - name: monitoring-config
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
