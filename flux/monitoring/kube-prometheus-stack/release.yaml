---
# kube-prometheus-stack: Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics + the Prometheus Operator. LGTM increment 1 (metrics,
# alerting, dashboards) — PVC-only; Loki/Tempo/Mimir + object storage come later.
# Deployed only when the cluster is bootstrapped with --monitoring (the monitoring
# reconcile root); it is heavy, so it is opt-in rather than a shared stack.
#
# Persistence uses ${storage_class} (do-block-storage on DOKS, standard on kind).
# Grafana is served under /${base_domain}/grafana (serve_from_sub_path) rather than
# a grafana.<base_domain> subdomain: that would sit two levels under the Cloudflare
# zone apex, outside Universal SSL (same reason echo uses the apex).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      # Exact pin; bumped by Renovate (flux manager).
      version: "88.1.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${storage_class}
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${storage_class}
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: ${storage_class}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      grafana.ini:
        server:
          root_url: "%(protocol)s://%(domain)s/grafana/"
          serve_from_sub_path: true
      ingress:
        enabled: true
        path: /grafana
        pathType: Prefix
        hosts:
          - ${base_domain}
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
