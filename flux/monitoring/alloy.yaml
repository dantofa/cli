---
# The Grafana Alloy stack (collector DaemonSet). dependsOn monitoring-config for
# the namespace. No postBuild substitution — its config carries no cluster-vars yet
# (the log/trace pipelines to Loki/Tempo land in later increments).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/monitoring/alloy
  prune: true
  dependsOn:
    - name: monitoring-config
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
