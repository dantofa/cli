---
# Grafana admin credentials, materialized from bws via the ESO `bitwarden`
# ClusterSecretStore. Only the password comes from bws (GRAFANA_ADMIN_PASSWORD);
# the username is templated to a fixed "admin". kube-prometheus-stack's Grafana
# reads this via grafana.admin.existingSecret.
#
# ACTION REQUIRED: GRAFANA_ADMIN_PASSWORD is the bws secret NAME (its value is the
# password) — not the password itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
