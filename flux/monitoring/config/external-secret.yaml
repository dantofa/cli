---
# Grafana admin credentials, GENERATED in-cluster by the ESO Password generator
# (generator.yaml) — no external secrets engine, no manual bws step. The username
# is templated to "admin"; the password is the generated value (key `password`).
# kube-prometheus-stack's Grafana reads this via grafana.admin.existingSecret.
#
# refreshInterval: 0 generates once and keeps it stable — silently rotating a live
# admin password would lock Grafana out until a restart. Scheduled rotation is a
# tracked follow-up (refreshInterval + a Reloader; on newer ESO, refreshPolicy).
# Read the password:
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 0
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
