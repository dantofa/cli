---
# yamllint disable rule:line-length
# Per-cluster cost dashboard (grafana-operator GrafanaDashboard). It multiplies the
# always-collected metrics (kube-state-metrics node/PV/Service counts, node-exporter
# egress) by the price constants dctl wrote into cluster-vars from the DO Sizes API,
# which Flux substitutes into the PromQL below (${node_hourly_price} etc.). It is a
# list-price *estimate* for comparing clusters, not the DO invoice — account-level
# spend + budget alerts stay with DO billing. Traffic is an upper bound: DO bandwidth
# is a pooled per-node allowance (read from the size's included transfer), billed at
# $0.01/GiB over that, and node-exporter's eth0 counter over-counts non-billable
# public traffic. instanceSelector picks the in-cluster Grafana (dashboards: dantofa);
# the panels bind to the Prometheus datasource by its fixed dantofa-prometheus UID.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-cost
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: dantofa
  resyncPeriod: 10m
  json: |
    {
      "uid": "dantofa-cluster-cost",
      "title": "Cluster cost (estimated)",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "5m",
      "time": {"from": "now-30d", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total (USD/mo)",
          "description": "List-price estimate of this cluster's monthly DO spend: compute + storage + LoadBalancers + estimated traffic overage. Not the DO invoice.",
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "decimals": 2, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none", "textMode": "value"},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "instant": true, "expr": "scalar((count(kube_node_info) or vector(0)) * ${node_hourly_price} * 730) + scalar((sum(kube_persistentvolume_capacity_bytes) or vector(0)) / 1073741824 * ${block_storage_gib_hourly} * 730) + scalar((count(kube_service_spec_type{type=\"LoadBalancer\"}) or vector(0)) * ${lb_hourly_price} * 730) + scalar(clamp_min((sum(increase(node_network_transmit_bytes_total{device=\"eth0\"}[30d])) or vector(0)) / 1073741824 - (count(kube_node_info) or vector(0)) * ${node_transfer_gib}, 0) * 0.01)"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Compute (USD/mo)",
          "description": "Live node count times the worker size's hourly price (from the DO Sizes API), over 730h.",
          "gridPos": {"h": 5, "w": 5, "x": 4, "y": 0},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "none", "graphMode": "area"},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "instant": true, "expr": "(count(kube_node_info) or vector(0)) * ${node_hourly_price} * 730"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Storage (USD/mo)",
          "description": "Total provisioned PersistentVolume bytes times DO's block-storage rate (USD 0.10/GiB-mo).",
          "gridPos": {"h": 5, "w": 5, "x": 9, "y": 0},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "none", "graphMode": "area"},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "instant": true, "expr": "(sum(kube_persistentvolume_capacity_bytes) or vector(0)) / 1073741824 * ${block_storage_gib_hourly} * 730"}
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "LoadBalancers (USD/mo)",
          "description": "Count of type=LoadBalancer Services times the DOKS LB price (USD 12/mo each).",
          "gridPos": {"h": 5, "w": 5, "x": 14, "y": 0},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "none", "graphMode": "area"},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "instant": true, "expr": "(count(kube_service_spec_type{type=\"LoadBalancer\"}) or vector(0)) * ${lb_hourly_price} * 730"}
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Traffic overage (USD/mo, est.)",
          "description": "Estimated only. eth0 egress over 30d minus the pooled per-node included transfer, billed at USD 0.01/GiB. Upper bound: eth0 over-counts non-billable traffic and the allowance is pooled account-wide, not per-cluster.",
          "gridPos": {"h": 5, "w": 5, "x": 19, "y": 0},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "none", "graphMode": "none"},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "instant": true, "expr": "clamp_min((sum(increase(node_network_transmit_bytes_total{device=\"eth0\"}[30d])) or vector(0)) / 1073741824 - (count(kube_node_info) or vector(0)) * ${node_transfer_gib}, 0) * 0.01"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Monthly cost by component (USD/mo)",
          "description": "Compute, storage and LoadBalancer monthly cost over time — how the cluster's steady-state spend tracks node autoscaling, PV growth and LB count.",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 20, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "lastNotNull"]}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "legendFormat": "Compute", "expr": "(count(kube_node_info) or vector(0)) * ${node_hourly_price} * 730"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "legendFormat": "Storage", "expr": "(sum(kube_persistentvolume_capacity_bytes) or vector(0)) / 1073741824 * ${block_storage_gib_hourly} * 730"},
            {"refId": "C", "datasource": {"type": "prometheus", "uid": "dantofa-prometheus"}, "legendFormat": "LoadBalancers", "expr": "(count(kube_service_spec_type{type=\"LoadBalancer\"}) or vector(0)) * ${lb_hourly_price} * 730"}
          ]
        }
      ]
    }
