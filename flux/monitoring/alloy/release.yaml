---
# Grafana Alloy — the unified OpenTelemetry collector, deployed as a DaemonSet.
# LGTM increment 1 lands it as the collector foundation with a minimal config
# (it runs, collecting nothing yet); the log pipeline (pod logs -> Loki) and the
# trace pipeline (-> Tempo) are wired in later increments, once those backends and
# their object-storage buckets exist. Deployed only with --monitoring.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      # Exact pin; bumped by Renovate (flux manager).
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # One agent per node (log/trace collection is node-local).
      type: daemonset
    alloy:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Minimal config: Alloy runs but ships nothing yet. Increment 2 adds the
      # pod-logs -> Loki pipeline (and later traces -> Tempo).
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }
