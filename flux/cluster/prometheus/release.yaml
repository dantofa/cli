---
# Local Prometheus (server-only) — the always-on base store and Alloy's
# remote_write destination #1. The prometheus-community chart bundles a whole
# stack; everything except the server is disabled here (Alloy provides
# node-exporter + kube-state-metrics; no Alertmanager/pushgateway yet). The server
# runs as a pure receiver: web.enable-remote-write-receiver on, scrape_configs
# emptied (Alloy scrapes). Short retention keeps it cheap on every cluster,
# including ephemeral preview/local; PVC uses ${storage_class}.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      # Exact pin; bumped by Renovate (flux manager).
      version: "29.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Subcharts off — this is a store only; Alloy owns collection.
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      retention: 6h
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      persistentVolume:
        enabled: true
        storageClass: ${storage_class}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    # Pure receiver: Alloy (k8s-monitoring) does all scraping and remote_writes
    # here, so disable every default scrape job the chart would generate (v29
    # builds prometheus.yml's scrape_configs from this map, not from serverFiles).
    scrapeConfigs:
      # Keep the self-scrape (localhost:9090) so the store self-monitors — its own
      # tsdb head series + samples-appended metrics are how we measure active
      # series and DPM (what a remote/Grafana Cloud backend would bill).
      prometheus:
        enabled: true
      kubernetes-api-servers:
        enabled: false
      kubernetes-nodes:
        enabled: false
      kubernetes-nodes-cadvisor:
        enabled: false
      kubernetes-service-endpoints:
        enabled: false
      kubernetes-service-endpoints-slow:
        enabled: false
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false
      kubernetes-pods:
        enabled: false
      kubernetes-pods-slow:
        enabled: false
