---
# Local Prometheus (server-only) — the always-on base store and Alloy's
# remote_write destination #1. The prometheus-community chart bundles a whole
# stack; everything except the server is disabled here (Alloy provides
# node-exporter + kube-state-metrics; no Alertmanager/pushgateway yet). The server
# runs as a pure receiver: web.enable-remote-write-receiver on, scrape_configs
# emptied (Alloy scrapes). Short retention keeps it cheap on every cluster,
# including ephemeral preview/local; PVC uses ${storage_class}.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      # Exact pin; bumped by Renovate (flux manager).
      version: "29.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Subcharts off — this is a store only; Alloy owns collection.
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      retention: 6h
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      persistentVolume:
        enabled: true
        storageClass: ${storage_class}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    # Pure receiver: no scrape targets of its own (Alloy remote_writes here).
    serverFiles:
      prometheus.yml:
        scrape_configs: []
