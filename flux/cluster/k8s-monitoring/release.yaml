---
# k8s-monitoring (v4): Alloy collectors for metrics and logs. alloy-metrics
# (StatefulSet) scrapes cluster + host + pod metrics and any ServiceMonitor/PodMonitor
# objects and remote_writes to the local Prometheus; alloy-logs (DaemonSet) tails pod
# logs and pushes them to the local Loki (podLogsViaLoki). It also deploys
# node-exporter and kube-state-metrics (telemetryServices). Traces stay at their
# disabled defaults until Tempo lands. Remote destinations (Grafana Cloud / remote
# Prometheus) are added as opt-in extra destinations with their own allowlist +
# cluster/env labels; a feature with no explicit destinations fans out to every
# signal-compatible destination. cluster.name is substituted from ${cluster_name}.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  # Short reconcile interval: part of this release's values come from opt-in
  # destination ConfigMaps (metrics-remote / grafana-cloud) that other roots supply
  # via the optional valuesFrom above. Flux watches those sources, but a newly
  # created optional ConfigMap can appear just after the HR last rendered; a 2m
  # interval bounds how long a freshly-enabled remote destination takes to reach
  # Alloy, without waiting for the default 10m or a manual reconcile.
  interval: 2m
  chart:
    spec:
      chart: k8s-monitoring
      # Exact pin; bumped by Renovate (flux manager).
      version: "4.3.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Optional hooks for the opt-in remote-destination roots: each supplies a
  # ConfigMap that deep-merges an extra remote_write destination into the values
  # below. Both absent by default (optional: true), so the base stack ships only
  # the local Prometheus destination; Flux re-reconciles when one appears/changes.
  # - k8s-monitoring-remote-destination: the in-cluster secondary (--metrics-remote)
  # - k8s-monitoring-grafana-cloud:       Grafana Cloud (--grafana-cloud)
  valuesFrom:
    - kind: ConfigMap
      name: k8s-monitoring-remote-destination
      optional: true
    - kind: ConfigMap
      name: k8s-monitoring-grafana-cloud
      optional: true
  values:
    cluster:
      name: ${cluster_name}
    # Always-on local destinations: the Prometheus remote-write receiver (metrics)
    # and the Loki push endpoint (logs). url is the full push path, as the
    # localPrometheus one is (the chart uses it verbatim).
    destinations:
      localPrometheus:
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
      localLoki:
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    # Collectors: alloy-metrics (clustered StatefulSet) scrapes/remote_writes metrics;
    # alloy-logs (DaemonSet) reads node-local pod log files and pushes to Loki.
    collectors:
      alloy-metrics:
        presets: [clustered, statefulset]
      alloy-logs:
        presets: [filesystem-log-reader, daemonset]
    # Deploy the exporters the metrics features scrape.
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
    # Metrics features (traces/events left at their disabled defaults).
    clusterMetrics:
      enabled: true
      collector: alloy-metrics
    hostMetrics:
      enabled: true
      collector: alloy-metrics
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
    # Log feature: tail pod logs on the alloy-logs DaemonSet. No explicit
    # destinations, so logs go to every logs-capable destination (local Loki now,
    # Grafana Cloud too when --grafana-cloud adds its loki destination).
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
