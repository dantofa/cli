---
# The always-on local Loki log store: a shared base stack the `cluster` reconcile
# root loads on every cluster, the log analogue of the prometheus stack. Alloy
# (k8s-monitoring, podLogsViaLoki) pushes pod logs here; Grafana Cloud becomes an
# opt-in second logs destination under --grafana-cloud. dependsOn prometheus for the
# `monitoring` namespace (and to reuse its `grafana` HelmRepository). No dependency on
# k8s-monitoring in either direction — Alloy's log push retries until Loki is Ready.
# postBuild.substituteFrom cluster-vars resolves ${storage_class} in the PVC.
# Source-agnostic sourceRef, filled by the root's substitution.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/cluster/loki
  prune: true
  wait: true
  dependsOn:
    - name: prometheus
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
