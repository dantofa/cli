---
# grafana-operator: the controller + its CRDs (Grafana, GrafanaDashboard,
# GrafanaDatasource, GrafanaFolder, …). Installed unconditionally as a base stack
# so dashboards/datasources can be managed declaratively as Kubernetes objects and
# reconciled into either an in-cluster Grafana or an external one (incl. Grafana
# Cloud) via a Grafana CR's instanceSelector. Only the operator is deployed here;
# the Grafana instances and dashboard/datasource CRs land in a later stage.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: grafana-system
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana-operator
      # Exact pin; bumped by Renovate (flux manager).
      version: "5.24.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: grafana-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
