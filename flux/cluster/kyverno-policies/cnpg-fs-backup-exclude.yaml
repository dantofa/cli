---
# Keep Velero's file-system backup off CloudNativePG's data volumes.
#
# The Velero stack runs with `defaultVolumesToFsBackup: true` and a daily
# all-namespace schedule, so every pod volume is backed up unless it opts out.
# For a Postgres instance that default is actively harmful: the node-agent copies
# a live data directory, producing a large, slow, crash-inconsistent artifact that
# looks like a database backup and is not one. CNPG owns database recovery through
# its own WAL archiving and base backups (PITR); Velero owns the cluster objects
# around it.
#
# Enforcing that by mutation rather than by convention is deliberate. The opt-out
# would otherwise have to be set on every downstream `Cluster` CR, and forgetting
# it fails silently — the backups still run, still cost storage, and only reveal
# themselves as useless at restore time.
#
# The volumes are excluded from fs-backup, NOT the PVC objects: the PVCs are still
# backed up and restored so the cluster's shape comes back, only their contents
# are left to CNPG. Volume names that a given Cluster does not declare (pg-wal
# without walStorage) are simply not found, which is harmless.
#
# Unlike the tenant-scoped policies alongside it, this one is not namespace-scoped:
# a CNPG instance is the same hazard wherever it runs. The `+()` anchor adds the
# annotation only when absent, so a downstream that deliberately sets its own
# value keeps it.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnpg-exclude-volumes-from-fs-backup
spec:
  background: true
  rules:
    - name: exclude-instance-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  cnpg.io/podRole: instance
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              +(backup.velero.io/backup-volumes-excludes): "pgdata,pg-wal,scratch-data,shm"
