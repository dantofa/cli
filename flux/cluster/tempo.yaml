---
# The always-on local Tempo trace store: a shared base stack the `cluster` reconcile
# root loads on every cluster, the trace analogue of the prometheus (metrics) and loki
# (logs) stacks. The k8s-monitoring Alloy OTLP receiver (applicationObservability)
# forwards app traces here; Grafana Cloud becomes an opt-in second trace destination
# under --grafana-cloud. dependsOn prometheus for the `monitoring` namespace (and to
# reuse its `grafana` HelmRepository); no dependency on k8s-monitoring in either
# direction — Alloy's trace export retries until Tempo is Ready.
# postBuild.substituteFrom cluster-vars resolves ${storage_class} in the PVC.
# Source-agnostic sourceRef, filled by the root's substitution.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/cluster/tempo
  prune: true
  wait: true
  dependsOn:
    - name: prometheus
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
