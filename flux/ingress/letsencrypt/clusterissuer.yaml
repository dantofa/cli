---
# ACME (Let's Encrypt) ClusterIssuer, shared by both ACME --tls-issuer values:
# letsencrypt (production CA) and staging (Let's Encrypt staging CA). One
# manifest — the issuer name, ACME endpoint, and account-key secret are
# substituted per cluster from cluster-vars (${tls_issuer}, ${acme_server}), so
# prod and preview reuse it. cert-manager obtains the cert via a DNS-01 challenge
# solved through Cloudflare (wildcards need DNS-01, and the challenge never
# touches ingress — the origin is only reachable through Cloudflare's proxy).
# Production is publicly trusted (Cloudflare Full strict); staging is untrusted
# with high rate limits, for ephemeral preview/CI clusters. A per-issuer account
# key (${tls_issuer}-account-key) keeps the prod and staging ACME accounts
# separate. No account email is set: cert-manager auto-renews, so expiry notices
# are unnecessary. Deployed only for an ACME --tls-issuer; selfsigned clusters
# use the always-present selfsigned issuer + Cloudflare Full instead.
#
# Split from the cloudflare-api-token Flux Kustomization that materializes this
# solver's DNS-01 token ExternalSecret: cert-manager evaluates the issuer's
# solver the moment it is applied and marks it InvalidSolver — without
# re-reconciling — if the token Secret is not yet present. Gating the issuer
# behind cloudflare-api-token (dependsOn + wait) guarantees the secret has synced
# before the issuer exists, closing that race.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${tls_issuer}
spec:
  acme:
    server: ${acme_server}
    privateKeySecretRef:
      name: ${tls_issuer}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
