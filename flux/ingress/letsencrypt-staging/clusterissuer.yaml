---
# ACME ClusterIssuer against Let's Encrypt's STAGING CA, for preview/CI clusters
# (--tls-issuer staging). Identical Cloudflare DNS-01 flow to the production
# letsencrypt issuer — wildcards via DNS-01, the challenge never touches ingress
# (the origin is only reachable through Cloudflare's proxy) — but pointed at the
# staging endpoint, whose high rate limits suit ephemeral per-PR clusters and
# keep the production CA's limits off the preview path. Staging issues untrusted
# certificates, which is fine here: Cloudflare terminates edge TLS with its own
# trusted cert (Full, not strict), and the CI probe validates the ACME/DNS-01 →
# Cloudflare flow, not browser trust. A distinct account key (staging-account-key)
# keeps the staging ACME account separate from production. No account email is
# set: cert-manager auto-renews, so expiry notices are unnecessary.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
