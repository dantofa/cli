---
# The Cloudflare API token for the tunnel ingress controller, materialized from
# bws via the ESO `bitwarden` ClusterSecretStore. It manages a named Cloudflare
# Tunnel and its DNS, so it needs a broader scope than external-dns:
# Account.Cloudflare Tunnel:Edit + Zone.DNS:Edit (external-dns needs only the
# latter). This is the default DOKS ingress token too, so a cluster's Bitwarden
# project must hold a CLOUDFLARE_API_TOKEN with the tunnel scope, not a
# DNS-only one — otherwise the controller cannot create/delete the tunnel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api
  namespace: cloudflare-tunnel-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflare-api
    template:
      data:
        account_id: "{{ .account_id }}"
        api_token: "{{ .api_token }}"
        tunnel_name: "${cluster_name}"
  data:
    - secretKey: account_id
      remoteRef:
        key: CLOUDFLARE_ACCOUNT_ID
    - secretKey: api_token
      remoteRef:
        key: CLOUDFLARE_API_TOKEN
