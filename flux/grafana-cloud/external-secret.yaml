---
# The Grafana Cloud metrics credential trio, materialized into the monitoring
# namespace via the ESO `bitwarden` ClusterSecretStore. k8s-monitoring's GC
# destination reads url/username/password from this Secret (secret.create: false),
# so the token never enters git or the cluster-vars ConfigMap — same model as the
# Cloudflare token.
#
# ACTION REQUIRED: GRAFANA_CLOUD_ACCESS_{URL,USER,TOKEN} are the bws secret NAMES
# (not the values). URL = the remote_write endpoint, USER = the metrics instance
# ID, TOKEN = an Access Policy token scoped metrics:write.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-access
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-cloud-access
  data:
    - secretKey: url
      remoteRef:
        key: GRAFANA_CLOUD_ACCESS_URL
    - secretKey: username
      remoteRef:
        key: GRAFANA_CLOUD_ACCESS_USER
    - secretKey: password
      remoteRef:
        key: GRAFANA_CLOUD_ACCESS_TOKEN
