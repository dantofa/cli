---
# Secondary Prometheus — a remote / Grafana-Cloud STAND-IN, deployed only with
# --metrics-remote (preview + local). Alloy's destination #2 remote_writes here so
# we can measure the active series + DPM a remote backend would bill, with no cloud
# account. Same pure-receiver config as the base store (default scrape jobs off,
# remote-write-receiver on). Reuses the prometheus-community HelmRepository the
# base prometheus stack registers in this namespace. ${storage_class} is
# substituted by the metrics-remote root.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-remote
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      # Exact pin; bumped by Renovate (flux manager).
      version: "29.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      retention: 6h
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      persistentVolume:
        enabled: true
        storageClass: ${storage_class}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    # Pure receiver: it only stores what Alloy remote_writes; disable every
    # default scrape job the chart would otherwise generate.
    scrapeConfigs:
      prometheus:
        enabled: false
      kubernetes-api-servers:
        enabled: false
      kubernetes-nodes:
        enabled: false
      kubernetes-nodes-cadvisor:
        enabled: false
      kubernetes-service-endpoints:
        enabled: false
      kubernetes-service-endpoints-slow:
        enabled: false
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false
      kubernetes-pods:
        enabled: false
      kubernetes-pods-slow:
        enabled: false
