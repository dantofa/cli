---
# The opt-in remote metrics destination, reconciled by the `metrics-remote` root
# that `dctl … cluster bootstrap --metrics-remote` applies (path:
# ./flux/metrics-remote). The root substitutes cluster-vars (${storage_class},
# ${cluster_name}) into these manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-remote.yaml
  - destination-configmap.yaml
